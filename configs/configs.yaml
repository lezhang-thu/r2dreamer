defaults:
  - env: dmc_vision
  - model: size12M
  # Disable Hydra's Python logging-to-file (train.log)
  - override hydra/job_logging: disabled
  - _self_

logdir: logdir/${now:%Y-%m-%d}/${now:%H-%M-%S}
#agent_load_path: /home/ubuntu/lezhang.thu/claude/r2dreamer/agent_interrupted_state_dict.pt  # Optional .pt containing only Dreamer.state_dict().
agent_load_path: null  # Optional .pt containing only Dreamer.state_dict().
seed: 0
deterministic_run: False
device: 'cuda:0'

hydra:
  run:
    dir: ${logdir}

batch_size: 16
batch_length: 64

buffer:
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  max_size: 5e5
  device: ${device}
  storage_device: 'cuda:0'

trainer:
  steps: ${env.steps}
  eval_every: 4e5
  eval_episode_num: ${env.eval_episode_num}
  batch_size: ${batch_size}
  batch_length: ${batch_length}
  grad_accum_steps: ${model.grad_accum_steps}
  # Counted in environment interactions; trainer maps this to its frame step.
  random_action_steps: 1e4
  train_ratio: ${env.train_ratio}
  update_log_every: 5e3
  action_repeat: ${env.action_repeat}
